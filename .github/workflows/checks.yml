name: Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14.0'
      # Findings or an unavailable registry fail the job; builds require its success.
      - name: Audit the complete lockfile against current advisories
        run: npm run --silent audit:dependencies -- --json > npm-audit.json
      - name: Preserve the audit report even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:${{ matrix.language }}'
          wait-for-processing: true

  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: dependency-audit
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # These exact versions reproduce the initially checked runtime baseline.
        node: ['20.19.0', '22.14.0']
    defaults:
      run:
        shell: bash
    steps:
      # Immutable pins prevent mutable action tags changing the release checks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run check:security-dependencies
      - run: npm run check:bridge-lifetime
      - run: npm run build
      - run: npm run package
      - name: Install the checked OpenCode host for isolated integration
        if: matrix.node == '22.14.0'
        # The shell delegation/storage/RPC contract is checked for 2.0.22 only.
        run: npm install --prefix .runtime/cli @opencode/cli@2.0.22 --no-audit --no-fund
      - name: Select the native CLI executable
        if: matrix.node == '22.14.0'
        run: |
          node --input-type=module <<'JS'
          import { accessSync, appendFileSync, readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const root = resolve('.runtime/cli/node_modules/@opencode/cli');
          const manifest = JSON.parse(readFileSync(resolve(root, 'package.json'), 'utf8'));
          const binary = resolve(root, manifest.bin.opencode);
          accessSync(binary);
          appendFileSync(process.env.GITHUB_ENV, `OPENCODE_JOBS_CLI=${binary}\n`);
          JS
      - name: Isolated OpenCode integration (no model credentials)
        if: matrix.node == '22.14.0'
        run: node scripts/smoke.js
